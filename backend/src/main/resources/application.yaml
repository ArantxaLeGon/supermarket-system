spring:
  application:
    name: supermarket

  datasource:
    url: jdbc:postgresql://localhost:5432/supermarket
    username: postgres
    password: #contraseña personal
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format-sql: true 
      database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 6060
